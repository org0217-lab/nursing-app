<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名單與照片上傳系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen py-8 px-4 font-sans text-gray-800">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">
                <i class="fa-solid fa-users-gear text-indigo-600 mr-2"></i>名單與照片上傳系統
            </h1>
            <p class="text-gray-500">請在下方輸入資料並上傳照片，系統將自動彙整至下方表格。</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
                <h2 class="text-lg font-semibold mb-4 text-gray-700 border-b pb-2">新增成員</h2>
                <form id="uploadForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">姓名 <span class="text-red-500">*</span></label>
                        <input type="text" id="nameInput" required 
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" 
                            placeholder="請輸入姓名">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">編號 / 備註</label>
                        <input type="text" id="noteInput" 
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" 
                            placeholder="例如：員工編號或職稱">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">上傳照片 <span class="text-red-500">*</span></label>
                        <div class="relative border-2 border-dashed border-gray-300 rounded-lg p-4 text-center hover:bg-gray-50 transition cursor-pointer group">
                            <input type="file" id="photoInput" accept="image/*" required 
                                class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                            <div id="uploadPrompt" class="space-y-1">
                                <i class="fa-solid fa-cloud-arrow-up text-2xl text-gray-400 group-hover:text-indigo-500 transition"></i>
                                <p class="text-xs text-gray-500">點擊或拖曳照片至此</p>
                            </div>
                            <img id="formPreview" class="hidden max-h-24 mx-auto rounded shadow-sm mt-1">
                        </div>
                    </div>

                    <button type="submit" 
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition shadow-sm flex justify-center items-center gap-2">
                        <i class="fa-solid fa-plus"></i> 加入名單
                    </button>
                </form>
            </div>

            <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-lg font-semibold text-gray-700">目前名單 (<span id="count">0</span>)</h2>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-600 text-sm font-medium border-b border-gray-200">
                                <th class="p-3">照片</th>
                                <th class="p-3">姓名</th>
                                <th class="p-3">編號 / 備註</th>
                                <th class="p-3 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="memberTableBody" class="divide-y divide-gray-100 text-sm">
                            <tr id="emptyRow">
                                <td colspan="4" class="p-8 text-center text-gray-400">
                                    <i class="fa-solid fa-folder-open text-3xl mb-2 block"></i>
                                    目前暫無資料，請從左側表單新增。
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const photoInput = document.getElementById('photoInput');
        const formPreview = document.getElementById('formPreview');
        const uploadPrompt = document.getElementById('uploadPrompt');
        const uploadForm = document.getElementById('uploadForm');
        const memberTableBody = document.getElementById('memberTableBody');
        const emptyRow = document.getElementById('emptyRow');
        const countSpan = document.getElementById('count');

        let memberCount = 0;

        // 1. 照片選擇後的即時預覽
        photoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    formPreview.src = event.target.result;
                    formPreview.classList.remove('hidden');
                    uploadPrompt.classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        // 2. 表單提交事件（新增資料到表格）
        uploadForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('nameInput').value;
            const note = document.getElementById('noteInput').value || '無';
            const photoSrc = formPreview.src;

            // 隱藏空狀態提示
            if (memberCount === 0) {
                emptyRow.classList.add('hidden');
            }

            // 建立新表格列
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-gray-50 transition';
            tr.innerHTML = `
                <td class="p-3">
                    <img src="${photoSrc}" class="w-12 h-12 object-cover rounded-full shadow-sm border border-gray-200">
                </td>
                <td class="p-3 font-medium text-gray-900">${name}</td>
                <td class="p-3 text-gray-500">${note}</td>
                <td class="p-3 text-center">
                    <button onclick="deleteMember(this)" class="text-red-500 hover:text-red-700 transition p-1">
                        <i class="fa-regular fa-trash-can text-base"></i>
                    </button>
                </td>
            `;

            // 插入表格並更新計數
            memberTableBody.appendChild(tr);
            memberCount++;
            countSpan.textContent = memberCount;

            // 重設表單與預覽狀態
            uploadForm.reset();
            formPreview.classList.add('hidden');
            formPreview.src = '';
            uploadPrompt.classList.remove('hidden');
        });

        // 3. 刪除資料功能
        function deleteMember(button) {
            const row = button.closest('tr');
            row.remove();
            memberCount--;
            countSpan.textContent = memberCount;

            // 若沒資料了，顯示空狀態提示
            if (memberCount === 0) {
                emptyRow.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
