<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虐貓通報系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .zoomable-img {
            cursor: zoom-in;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen py-8 px-4 font-sans text-gray-800">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-end mb-4 gap-2 text-sm">
            <div id="adminZone" class="hidden items-center gap-2 bg-green-100 text-green-800 px-3 py-1 rounded-full font-medium">
                <i class="fa-solid fa-user-shield"></i> 管理員模式已啟動
                <button onclick="logout()" class="text-red-600 hover:underline ml-2">登出</button>
            </div>
            <button id="loginBtn" onclick="toggleLoginModal()" class="text-gray-500 hover:text-gray-800 flex items-center gap-1">
                <i class="fa-solid fa-lock"></i> 管理員登入
            </button>
        </div>

        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-red-600 mb-2">
                <i class="fa-solid fa-triangle-exclamation text-red-600 mr-2"></i>虐貓通報系統
            </h1>
            <p class="text-gray-500">此系統已連線雲端資料庫。所有人皆可直接拍照或選擇相片回報，僅限管理員有權限刪除。</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
                <h2 class="text-lg font-semibold mb-4 text-gray-700 border-b pb-2">回報名單資料</h2>
                <form id="uploadForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">姓名 / 綽號 <span class="text-red-500">*</span></label>
                        <input type="text" id="nameInput" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent" placeholder="請輸入姓名或網路綽號">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">事件說明 / 遭遇地點 <span class="text-red-500">*</span></label>
                        <input type="text" id="noteInput" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent" placeholder="例如：行凶地點、涉案具體事由">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">上傳照片 / 證物截圖 <span class="text-red-500">*</span></label>
                        <div class="relative border-2 border-dashed border-gray-300 rounded-lg p-4 text-center hover:bg-gray-50 transition cursor-pointer group">
                            <input type="file" id="photoInput" accept="image/*" required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                            <div id="uploadPrompt" class="space-y-1">
                                <i class="fa-solid fa-image text-2xl text-gray-400 group-hover:text-red-500 transition"></i>
                                <p class="text-xs text-gray-500">點擊選擇照片或拍照</p>
                            </div>
                            <img id="formPreview" class="hidden max-h-24 mx-auto rounded shadow-sm mt-1">
                        </div>
                    </div>
                    <button type="submit" id="submitBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2.5 px-4 rounded-lg transition shadow-sm flex justify-center items-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i> 傳送資料
                    </button>
                </form>
            </div>

            <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-lg font-semibold text-gray-700">目前列管名單 (<span id="count">0</span>)</h2>
                    <button onclick="fetchData()" class="text-xs text-indigo-600 hover:underline"><i class="fa-solid fa-rotate-right mr-1"></i>重新整理名單</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-600 text-sm font-medium border-b border-gray-200">
                                <th class="p-3">照片 / 證物</th>
                                <th class="p-3">姓名 / 綽號</th>
                                <th class="p-3">事件說明 / 地點</th>
                                <th class="p-3 text-center action-header hidden">操作</th>
                            </tr>
                        </thead>
                        <tbody id="memberTableBody" class="divide-y divide-gray-100 text-sm">
                            <tr id="emptyRow"><td colspan="4" class="p-8 text-center text-gray-400"><i class="fa-solid fa-spinner animate-spin text-2xl mb-2 block"></i>連線雲端資料庫中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="loginModal" class="hidden fixed inset-0 bg-black/50 justify-center items-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl max-w-sm w-full shadow-xl">
            <h3 class="text-lg font-bold mb-4"><i class="fa-solid fa-user-lock text-indigo-600 mr-1"></i> 管理員登入</h3>
            <div class="space-y-3">
                <input type="password" id="adminPassword" class="w-full px-3 py-2 border rounded-lg" placeholder="請輸入管理員密碼">
                <div class="flex justify-end gap-2 pt-2">
                    <button onclick="toggleLoginModal()" class="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-lg">取消</button>
                    <button onclick="login()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">確認登入</button>
                </div>
            </div>
        </div>
    </div>

    <div id="imageLightbox" class="hidden fixed inset-0 bg-black/80 justify-center items-center p-4 z-50 cursor-zoom-out" onclick="closeLightbox()">
        <button class="absolute top-4 right-4 text-white text-3xl hover:text-gray-300 transition" onclick="closeLightbox()">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <img id="lightboxImg" class="max-w-full max-h-[90vh] rounded-lg shadow-2xl object-contain" src="" alt="放大證物">
    </div>

    <script>
        const SHEETDB_URL = "https://sheetdb.io/api/v1/l8t0q7pya1f58";
        const IMGBB_API_KEY = "553419e2ce49f5d42f3c452cf988fe19";
        const ADMIN_PASSWORD = "admin123";

        let isAdmin = false;
        let selectedFile = null;

        window.onload = function() {
            fetchData();
        };

        // 處理圖片即時預覽
        document.getElementById('photoInput').addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    document.getElementById('formPreview').src = event.target.result;
                    document.getElementById('formPreview').classList.remove('hidden');
                    document.getElementById('uploadPrompt').classList.add('hidden');
                }
                reader.readAsDataURL(selectedFile);
            }
        });

        // 抓取資料並在表格中渲染
        async function fetchData() {
            const tbody = document.getElementById('memberTableBody');
            tbody.innerHTML = `<tr id="emptyRow"><td colspan="4" class="p-8 text-center text-gray-400"><i class="fa-solid fa-spinner animate-spin text-2xl mb-2 block"></i>連線雲端資料庫中...</td></tr>`;
            try {
                const response = await fetch(SHEETDB_URL);
                const data = await response.json();
                document.getElementById('count').textContent = data.length;
                tbody.innerHTML = '';

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr id="emptyRow"><td colspan="4" class="p-8 text-center text-gray-400"><i class="fa-solid fa-shield-cat text-3xl mb-2 block text-gray-300"></i>目前暫無列管資料。</td></tr>`;
                    return;
                }

                data.reverse().forEach((item) => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-red-50/30 transition';
                    tr.innerHTML = `
                        <td class="p-3">
                            <img src="${item.photo}" onclick="openLightbox('${item.photo}')" class="zoomable-img w-12 h-12 object-cover rounded shadow-sm border hover:opacity-80 transition" onerror="this.src='https://placehold.co/100x100?text=No+Image'">
                        </td>
                        <td class="p-3 font-medium text-gray-900">${item.name}</td>
                        <td class="p-3 text-gray-600">${item.note}</td>
                        <td class="p-3 text-center action-cell ${isAdmin ? '' : 'hidden'}">
                            <button onclick="deleteMember('${item.name}')" class="text-gray-400 hover:text-red-600 transition p-1">
                                <i class="fa-regular fa-trash-can text-base"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                tbody.innerHTML = `<tr id="emptyRow"><td colspan="4" class="p-8 text-center text-red-500"><i class="fa-solid fa-circle-xmark text-2xl mb-2 block"></i>讀取資料失敗。</td></tr>`;
            }
        }

        // 提交表單（自動圖片上傳）
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            if(!selectedFile) return alert('請選擇或拍攝一張照片！');

            const name = document.getElementById('nameInput').value;
            const note = document.getElementById('noteInput').value; // 移除預設的 '未填寫'

            try {
                submitBtn.disabled = true;
                submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 照片上傳中...`;

                const formData = new FormData();
                formData.append('image', selectedFile);

                const imgbbResponse = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const imgbbResult = await imgbbResponse.json();

                if(!imgbbResult.success) {
                    throw new Error('圖床伺服器拒絕上傳');
                }

                const photoUrl = imgbbResult.data.url;
                submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 同步試算表中...`;

                const response = await fetch(SHEETDB_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: [{ name, note, photo: photoUrl }] })
                });

                if(response.ok) {
                    alert('回報成功！照片已自動同步至雲端名單。');
                    document.getElementById('uploadForm').reset();
                    document.getElementById('formPreview').classList.add('hidden');
                    document.getElementById('uploadPrompt').classList.remove('hidden');
                    selectedFile = null;
                    fetchData();
                } else {
                    alert('資料庫寫入失敗。');
                }
            } catch (error) {
                console.error(error);
                alert('上傳發生錯誤，請稍後再試。');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> 傳送資料`;
            }
        });

        // 刪除資料
        async function deleteMember(name) {
            if(!confirm(`確定要刪除「${name}」的列管資料嗎？`)) return;
            try {
                const response = await fetch(`${SHEETDB_URL}/name/${name}`, { method: 'DELETE' });
                if(response.ok) { alert('刪除成功！'); fetchData(); } else { alert('刪除失敗。'); }
            } catch (error) { alert('刪除連線失敗。'); }
        }

        // 打開大圖燈箱控制
        window.openLightbox = (src) => {
            const lightbox = document.getElementById('imageLightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            lightboxImg.src = src;
            lightbox.classList.remove('hidden');
            lightbox.classList.add('flex');
        };

        // 關閉大圖燈箱控制
        window.closeLightbox = () => {
            const lightbox = document.getElementById('imageLightbox');
            lightbox.classList.add('hidden');
            lightbox.classList.remove('flex');
        };

        // 管理員彈窗與登入控制
        window.toggleLoginModal = () => {
            document.getElementById('loginModal').classList.toggle('hidden');
            document.getElementById('loginModal').classList.toggle('flex');
        };
        window.login = () => {
            const pass = document.getElementById('adminPassword').value;
            if(pass === ADMIN_PASSWORD) {
                isAdmin = true;
                document.getElementById('loginBtn').classList.add('hidden');
                document.getElementById('adminZone').classList.remove('hidden');
                document.getElementById('adminZone').classList.add('flex');
                document.querySelectorAll('.action-header, .action-cell').forEach(el => el.classList.remove('hidden'));
                toggleLoginModal();
                document.getElementById('adminPassword').value = '';
            } else { alert('密碼錯誤！'); }
        };
        window.logout = () => {
            if(confirm('確定要登出管理員身分嗎？')) {
                isAdmin = false;
                document.getElementById('loginBtn').classList.remove('hidden');
                document.getElementById('adminZone').classList.add('hidden');
                document.getElementById('adminZone').classList.remove('flex');
                document.querySelectorAll('.action-header, .action-cell').forEach(el => el.classList.add('hidden'));
            }
        };
    </script>
</body>
</html>
